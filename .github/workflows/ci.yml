name: CI
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: node --test
      - name: Syntax check
        run: for f in *.js; do node --check "$f"; done
      - name: Manifest valid
        run: python3 -c "import json; json.load(open('manifest.json'))"
