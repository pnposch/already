name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests
        run: node --test
      - name: Package extension
        run: bash scripts/package.sh
      - name: Attach zip to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
